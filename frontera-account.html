<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frontera X — Account</title>
<style>
  :root{
    --surface-page:#ffffff;
    --surface-primary:#f5f5f5;
    --surface-secondary:#e8eaeb;
    --surface-action-1:#00c950;
    --surface-action-hover-1:#02ae46;
    --surface-action-2:#0e131e;
    --text-heading-2:#0e131e;
    --text-body:#2b2f33;
    --text-secondary-body:#7e8fa8;
    --text-error:#ff0026;
    --border-primary:#e8eaeb;
    --icon-primary:#7e8fa8;
    --radius-button:12px;
    --radius-input:8px;
    --radius-card:12px;
    --font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font-family);
    color:var(--text-body);
    background:var(--surface-primary);
  }

  .app-shell{display:flex;flex-direction:column;min-height:100vh;}

  /* ---------- Navbar ---------- */
  .navbar{
    height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;background:var(--surface-page);border-bottom:1px solid var(--border-primary);
  }
  .navbar-right{display:flex;align-items:center;gap:28px;}
  .nav-link{
    font-size:14px;font-weight:700;color:var(--text-heading-2);text-decoration:none;
    padding:8px 0;border-bottom:2px solid transparent;
  }
  .nav-link.active{color:var(--surface-action-1);border-bottom-color:var(--surface-action-1);}
  .nav-icon-btn{
    width:36px;height:36px;border-radius:50%;border:none;background:var(--surface-primary);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-heading-2);
  }
  .nav-icon-btn:hover{background:var(--surface-secondary);}
  .logo-tile{
    width:36px;height:36px;border-radius:9px;background:var(--surface-action-2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .logo-tile svg{width:13px;height:16.4px;}

  /* ---------- Page body ---------- */
  .page-body{flex:1;display:flex;justify-content:center;padding:64px 24px;}

  .account-card{
    width:600px;max-width:100%;background:var(--surface-page);border-radius:var(--radius-card);
    padding:40px;display:flex;flex-direction:column;align-items:center;
  }

  .avatar{
    width:36px;height:36px;border-radius:50%;background:var(--surface-action-2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:12px;
  }
  .avatar svg{width:13.5px;height:17px;}

  .account-card h1{font-size:20px;font-weight:700;color:var(--text-heading-2);margin:0 0 32px;}

  .info-list{width:100%;}
  .info-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 0;border-bottom:1px solid var(--border-primary);
  }
  .info-row:last-child{border-bottom:none;}
  .info-row .label{font-size:14px;font-weight:600;color:var(--text-heading-2);}
  .info-row .value-group{display:flex;align-items:center;gap:10px;}
  .info-row .value{font-size:14px;color:var(--text-body);}
  .info-row .value.muted{color:var(--text-secondary-body);}

  .icon-btn{
    width:32px;height:32px;border-radius:8px;border:none;background:transparent;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--icon-primary);
    flex-shrink:0;position:relative;
  }
  .icon-btn:hover{background:var(--surface-primary);color:var(--text-heading-2);}
  .icon-btn:disabled{pointer-events:none;}
  .icon-btn.copied{color:var(--surface-action-1);}

  .copy-toast{
    position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
    background:var(--surface-action-2);color:#fff;font-size:11px;font-weight:600;
    padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;
    transition:opacity .15s ease;
  }
  .icon-btn.copied .copy-toast{opacity:1;}

  .logout-row{
    display:flex;align-items:center;gap:10px;padding:18px 0 0;margin-top:8px;width:100%;
    cursor:pointer;color:var(--text-error);background:none;border:none;font-family:var(--font-family);
    font-size:14px;font-weight:600;text-align:left;
  }
  .logout-row:hover{opacity:.75;}
  .logout-row svg{width:18px;height:18px;flex-shrink:0;}

  /* ---------- Modal overlay ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(14,19,30,.5);display:none;
    align-items:center;justify-content:center;z-index:1000;
  }
  .modal-overlay.open{display:flex;}
  .modal-dialog{
    background:var(--surface-page);border-radius:16px;width:420px;max-width:calc(100% - 32px);
    padding:28px;display:flex;flex-direction:column;gap:24px;
  }
  .modal-header{display:flex;align-items:center;justify-content:space-between;}
  .modal-header h2{font-size:17px;font-weight:700;color:var(--text-heading-2);margin:0;}
  .modal-close{
    width:32px;height:32px;border-radius:50%;border:none;background:var(--surface-primary);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-heading-2);
  }

  .setting-row{display:flex;flex-direction:column;gap:10px;}
  .setting-row .setting-label{font-size:13px;font-weight:600;color:var(--text-secondary-body);text-transform:uppercase;letter-spacing:.03em;}

  .segmented{
    display:flex;gap:8px;background:var(--surface-secondary);border-radius:100px;padding:4px;width:100%;
  }
  .segmented button{
    flex:1;border:none;background:transparent;border-radius:100px;padding:8px 12px;
    font-family:var(--font-family);font-size:14px;font-weight:600;color:var(--text-body);
    cursor:pointer;white-space:nowrap;
  }
  .segmented button.active{background:var(--surface-page);}

  .modal-actions{display:flex;justify-content:flex-end;gap:12px;}
  .btn{
    font-family:var(--font-family);font-size:14px;border:none;border-radius:var(--radius-button);
    padding:10px 24px;cursor:pointer;
  }
  .btn-outline{background:transparent;border:1px solid var(--border-primary);color:var(--text-heading-2);}
  .btn-primary{background:var(--surface-action-2);color:#fff;}
  .navbar-right{flex-wrap:wrap;}
  .nav-region-link{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom;}
  .nav-dropdown{position:relative;}
  .nav-dropdown-trigger{
    display:flex;align-items:center;gap:4px;background:none;border:none;cursor:pointer;
    font-family:var(--font-family);
  }
  .nav-dropdown-trigger .chev{transition:transform .15s ease;color:var(--icon-primary);}
  .nav-dropdown.open .nav-dropdown-trigger .chev{transform:rotate(180deg);}
  .nav-dropdown-menu{
    position:absolute;top:calc(100% + 12px);right:0;min-width:220px;background:var(--surface-page);
    border-radius:var(--radius-card);box-shadow:0 8px 24px rgba(0,0,0,.15);padding:8px;
    display:none;flex-direction:column;gap:2px;z-index:600;
  }
  .nav-dropdown.open .nav-dropdown-menu{display:flex;}
  .nav-dropdown-menu a{
    display:block;padding:8px 12px;border-radius:8px;font-size:14px;color:var(--text-heading-2);
    text-decoration:none;max-width:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .nav-dropdown-menu a:hover{background:var(--surface-primary);}

  .navbar{display:flex;align-items:center;justify-content:space-between;}
  .navbar-left{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}

  .country-select{position:relative;}
  .country-trigger{
    display:flex;align-items:center;gap:8px;background:var(--surface-primary);border:none;
    border-radius:var(--radius-button);padding:8px 12px;font-family:var(--font-family);
    font-size:14px;font-weight:700;color:var(--text-heading-2);cursor:pointer;
  }
  .country-trigger:hover{background:var(--surface-secondary);}
  .country-trigger .flag{font-size:16px;line-height:1;}
  .country-trigger .chev{color:var(--icon-primary);flex-shrink:0;transition:transform .15s ease;}
  .country-select.open .country-trigger .chev{transform:rotate(180deg);}
  .country-dropdown-panel{
    position:absolute;top:calc(100% + 8px);left:0;width:220px;max-height:340px;overflow-y:auto;
    background:var(--surface-page);border:1px solid var(--border-primary);border-radius:var(--radius-card);
    box-shadow:0 8px 24px rgba(0,0,0,.15);padding:4px;display:none;flex-direction:column;gap:2px;z-index:600;
  }
  .country-select.open .country-dropdown-panel{display:flex;}
  .country-dropdown-panel .item{
    display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-input);
    font-size:14px;color:var(--text-heading-2);cursor:pointer;background:none;border:none;
    width:100%;text-align:left;font-family:var(--font-family);
  }
  .country-dropdown-panel .item:hover{background:var(--surface-secondary);}
  .country-dropdown-panel .item.selected{background:var(--surface-success);color:var(--text-success);font-weight:700;}
  .country-dropdown-panel .item .ic{color:var(--text-success);flex-shrink:0;visibility:hidden;}
  .country-dropdown-panel .item.selected .ic{visibility:visible;}

</style>
</head>

<script>
  function copyAccountId(){
    const id = 'ACC-83920-RX';
    navigator.clipboard.writeText(id).catch(()=>{});
    const btn = document.getElementById('copy-btn');
    btn.classList.add('copied');
    setTimeout(()=>btn.classList.remove('copied'), 1200);
  }

  function openUnitsModal(){
    document.getElementById('units-modal').classList.add('open');
  }
  function closeUnitsModal(){
    document.getElementById('units-modal').classList.remove('open');
  }

  document.querySelectorAll('.segmented').forEach(group => {
    group.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        group.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  });

  function saveUnits(){
    const values = [];
    document.querySelectorAll('.segmented').forEach(group => {
      const active = group.querySelector('button.active');
      values.push(active.getAttribute('data-value'));
    });
    document.getElementById('units-summary').textContent = values.join(', ');
    closeUnitsModal();
  }

  function handleLogout(){
    window.location.href = 'frontera-signup.html';
  }

  // close modal on overlay click (outside dialog)
  document.getElementById('units-modal').addEventListener('click', function(e){
    if (e.target === this) closeUnitsModal();
  });
  // ---- Shared navbar: region name truncation + "Other regions" dropdown ----
  function truncateNavRegionNames(){
    document.querySelectorAll('.nav-region-link').forEach(el => {
      const full = el.getAttribute('data-region-name') || el.textContent.trim();
      el.title = full;
      el.textContent = full.length > 12 ? full.slice(0, 12) + '…' : full;
    });
  }
  truncateNavRegionNames();

  function toggleNavDropdown(e){
    e.stopPropagation();
    document.querySelector('.nav-dropdown').classList.toggle('open');
  }
  document.addEventListener('click', function(e){
    const dd = document.querySelector('.nav-dropdown');
    if (dd && !dd.contains(e.target)) dd.classList.remove('open');
  });

  // ---- Country dropdown ----
  function toggleCountryDropdown(e){
    e.stopPropagation();
    document.querySelector('.country-select').classList.toggle('open');
  }
  const countryFlags = {
    'Romania':'🇷🇴','Bulgaria':'🇧🇬','Czechia':'🇨🇿','Estonia':'🇪🇪','Croatia':'🇭🇷',
    'Hungary':'🇭🇺','Latvia':'🇱🇻','Poland':'🇵🇱','Portugal':'🇵🇹','Slovakia':'🇸🇰'
  };
  function selectCountry(el, name){
    document.querySelectorAll('.country-dropdown-panel .item').forEach(i => i.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('country-trigger-label').textContent = name;
    document.getElementById('country-trigger-flag').textContent = countryFlags[name] || '🏳️';
    document.querySelector('.country-select').classList.remove('open');
  }
  document.addEventListener('click', function(e){
    const cs = document.querySelector('.country-select');
    if (cs && !cs.contains(e.target)) cs.classList.remove('open');
  });

</script>

</body>
</html>
