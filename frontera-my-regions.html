<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frontera X — My Regions</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --surface-page:#ffffff;
    --surface-primary:#f5f5f5;
    --surface-secondary:#e8eaeb;
    --surface-action-1:#00c950;
    --surface-action-hover-1:#02ae46;
    --surface-action-2:#0e131e;
    --text-heading-2:#0e131e;
    --text-body:#2b2f33;
    --text-secondary-body:#7e8fa8;
    --text-accent:#00c950;
    --border-primary:#e8eaeb;
    --icon-primary:#7e8fa8;
    --radius-button:12px;
    --radius-input:8px;
    --radius-card:12px;
    --font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font-family);
    color:var(--text-body);
    background:var(--surface-primary);
  }

  .app-shell{display:flex;flex-direction:column;height:100vh;}

  /* ---------- Navbar ---------- */
  .navbar{
    height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;background:var(--surface-page);border-bottom:1px solid var(--border-primary);
  }
  .navbar-right{display:flex;align-items:center;gap:28px;}
  .nav-link{
    font-size:14px;font-weight:700;color:var(--text-heading-2);text-decoration:none;
    padding:8px 0;border-bottom:2px solid transparent;
  }
  .nav-link.active{color:var(--text-accent);border-bottom-color:var(--text-accent);}
  .nav-icon-btn{
    width:36px;height:36px;border-radius:50%;border:none;background:var(--surface-primary);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-heading-2);
  }
  .nav-icon-btn:hover{background:var(--surface-secondary);}
  .logo-tile{
    width:36px;height:36px;border-radius:9px;background:var(--surface-action-2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .logo-tile svg{width:13px;height:16.4px;}

  /* ---------- Body layout ---------- */
  .body-row{flex:1;display:flex;min-height:0;}

  .sidebar{
    width:480px;flex-shrink:0;padding:24px;overflow-y:auto;
    display:flex;flex-direction:column;gap:16px;
    border-right:1px solid var(--border-primary);
  }
  .sidebar h1{font-size:17px;font-weight:700;color:var(--text-heading-2);margin:0 0 4px;}

  .stats-banner{
    background:var(--surface-page);border-radius:var(--radius-card);padding:20px;
    display:flex;flex-direction:column;gap:16px;
  }
  .stats-banner-header{display:flex;align-items:center;justify-content:space-between;}
  .stats-banner-header .country{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--text-heading-2);}
  .stats-banner-header .country .flag{font-size:18px;line-height:1;}
  .stats-banner-row{display:flex;justify-content:space-between;gap:16px;}
  .stats-banner .stat{display:flex;flex-direction:column;gap:6px;}
  .stats-banner .stat .label{font-size:13px;color:var(--text-secondary-body);}
  .stats-banner .stat .value{font-size:15px;font-weight:700;color:var(--text-heading-2);}
  .pct-inline{font-size:12px;font-weight:600;color:var(--text-secondary-body);}

  .region-card{
    background:var(--surface-page);border-radius:var(--radius-card);padding:20px;
    display:flex;flex-direction:column;gap:16px;border:1px solid transparent;
  }
  .region-card-top{display:flex;align-items:center;justify-content:space-between;}
  .region-name{display:flex;align-items:center;gap:10px;}
  .region-swatch{width:14px;height:14px;border-radius:4px;background:var(--surface-action-1);flex-shrink:0;}
  .region-name input{
    font-size:15px;font-weight:700;color:var(--text-heading-2);border:none;outline:none;
    font-family:var(--font-family);background:transparent;padding:2px 4px;border-radius:6px;width:180px;
  }
  .region-name input:focus{background:var(--surface-primary);}
  .icon-btn{
    width:32px;height:32px;border-radius:8px;border:none;background:transparent;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--icon-primary);
  }
  .icon-btn:hover{background:var(--surface-primary);color:var(--text-heading-2);}

  .region-meta{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid var(--border-primary);border-bottom:1px solid var(--border-primary);}
  .region-meta .item{display:flex;flex-direction:column;}
  .region-meta .item:last-child{align-items:flex-end;text-align:right;}
  .region-meta .item .label{font-size:12px;color:var(--text-secondary-body);margin-bottom:2px;}
  .region-meta .item .value{font-size:15px;font-weight:600;color:var(--text-heading-2);}

  .assumptions{display:flex;flex-direction:column;gap:6px;}
  .assumptions .title{font-size:10px;font-weight:700;color:var(--text-secondary-body);text-transform:uppercase;letter-spacing:.04em;}
  .assumptions .title-row{display:flex;align-items:center;gap:6px;}
  .info-icon{
    position:relative;
    width:14px;height:14px;border-radius:50%;border:1px solid var(--text-secondary-body);
    color:var(--text-secondary-body);font-size:9px;font-weight:700;font-style:italic;
    display:flex;align-items:center;justify-content:center;cursor:help;flex-shrink:0;
  }
  .info-icon .tooltip-bubble{
    position:absolute;bottom:calc(100% + 8px);left:0;transform:translateY(4px);
    background:var(--surface-action-2);color:#fff;font-size:12px;font-weight:400;font-style:normal;
    line-height:16px;padding:8px 12px;border-radius:8px;white-space:normal;width:210px;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .08s ease, transform .08s ease;
    transition-delay:0s;
    z-index:10;
  }
  .info-icon .tooltip-bubble::after{
    content:'';position:absolute;top:100%;left:6px;
    border:5px solid transparent;border-top-color:var(--surface-action-2);
  }
  .info-icon:hover .tooltip-bubble{
    opacity:1;visibility:visible;transform:translateY(0);
    transition-delay:.05s;
  }
  .assumptions-row{display:flex;gap:6px;}
  .assumption-pill{
    flex:1;background:var(--surface-primary);border-radius:var(--radius-input);padding:6px 8px;
    text-align:center;
  }
  .assumption-pill .pct{font-size:13px;font-weight:700;color:var(--text-heading-2);}
  .assumption-pill .tag{font-size:10px;color:var(--text-secondary-body);margin-top:1px;}

  .region-card-actions{display:flex;align-items:center;gap:12px;}
  .view-details-link{
    font-size:14px;color:var(--text-heading-2);text-decoration:none;font-weight:600;white-space:nowrap;
    display:inline-flex;align-items:center;gap:2px;transition:color .12s ease;
  }
  .view-details-link:hover{color:var(--surface-action-1);}
  .view-details-link .chevron{flex-shrink:0;}

  .add-region-card{
    border:1.5px dashed var(--border-primary);border-radius:var(--radius-card);
    padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;color:var(--text-secondary-body);background:transparent;
  }
  .add-region-card:hover{border-color:var(--surface-action-2);color:var(--text-heading-2);background:var(--surface-page);}
  .add-region-card .plus{
    width:32px;height:32px;border-radius:50%;background:var(--surface-secondary);
    display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-heading-2);
  }
  .add-region-card span.label{font-size:14px;font-weight:600;}

  /* ---------- Map ---------- */
  .map-wrap{flex:1;position:relative;}
  #map{position:absolute;inset:0;background:#e8eaeb;}

  .map-search{
    position:absolute;top:16px;left:16px;right:16px;max-width:380px;z-index:500;
    background:var(--surface-page);border-radius:var(--radius-button);box-shadow:0 2px 8px rgba(0,0,0,.12);
    display:flex;align-items:center;gap:10px;padding:12px 16px;
  }
  .map-search svg{width:18px;height:18px;color:var(--icon-primary);flex-shrink:0;}
  .map-search input{border:none;outline:none;font-family:var(--font-family);font-size:14px;width:100%;background:transparent;}
  .map-search input::placeholder{color:var(--text-secondary-body);}

  .map-controls{
    position:absolute;top:16px;right:16px;z-index:500;display:flex;flex-direction:column;gap:8px;
  }
  .map-btn{
    width:36px;height:36px;background:var(--surface-page);border:none;border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--text-heading-2);font-size:16px;
  }
  .map-btn:hover{background:var(--surface-primary);}
  .map-btn-group{display:flex;flex-direction:column;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12);}
  .map-btn-group .map-btn{box-shadow:none;border-radius:0;border-bottom:1px solid var(--border-primary);}
  .map-btn-group .map-btn:last-child{border-bottom:none;}

  .map-layers-btn{
    position:absolute;bottom:24px;right:16px;z-index:500;width:40px;height:40px;
    background:var(--surface-page);border:none;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.12);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-heading-2);
  }

  .region-label{
    background:var(--surface-action-1);color:var(--text-heading-2);font-weight:700;font-size:12px;
    padding:4px 10px;border-radius:999px;border:1.5px solid var(--surface-page);white-space:nowrap;
    font-family:var(--font-family);box-shadow:0 1px 4px rgba(0,0,0,.15);
  }

  /* ---------- Footer ---------- */
  .app-footer{
    height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;background:var(--surface-page);border-top:1px solid var(--border-primary);
    font-size:13px;color:var(--text-secondary-body);
  }
  .app-footer .links{display:flex;gap:20px;}
  .app-footer a{color:var(--text-secondary-body);text-decoration:underline;}
  .navbar-right{flex-wrap:wrap;}
  #navbar-region-tabs{display:contents;}
  .nav-region-link{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom;}
  .nav-dropdown{position:relative;}
  .nav-dropdown-trigger{
    display:flex;align-items:center;gap:4px;background:none;border:none;cursor:pointer;
    font-family:var(--font-family);
  }
  .nav-dropdown-trigger .chev{transition:transform .15s ease;color:var(--icon-primary);}
  .nav-dropdown.open .nav-dropdown-trigger .chev{transform:rotate(180deg);}
  .nav-dropdown-menu{
    position:absolute;top:calc(100% + 12px);right:0;min-width:220px;background:var(--surface-page);
    border-radius:var(--radius-card);box-shadow:0 8px 24px rgba(0,0,0,.15);padding:8px;
    display:none;flex-direction:column;gap:2px;z-index:600;
  }
  .nav-dropdown.open .nav-dropdown-menu{display:flex;}
  .nav-dropdown-menu a{
    display:block;padding:8px 12px;border-radius:8px;font-size:14px;color:var(--text-heading-2);
    text-decoration:none;max-width:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .nav-dropdown-menu a:hover{background:var(--surface-primary);}

  .navbar{display:flex;align-items:center;justify-content:space-between;}
  .navbar-left{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}

  .country-select{position:relative;}
  .country-trigger{
    display:flex;align-items:center;gap:8px;background:var(--surface-primary);border:none;
    border-radius:var(--radius-button);padding:8px 12px;font-family:var(--font-family);
    font-size:14px;font-weight:700;color:var(--text-heading-2);cursor:pointer;
  }
  .country-trigger:hover{background:var(--surface-secondary);}
  .country-trigger .flag{font-size:16px;line-height:1;}
  .country-trigger .chev{color:var(--icon-primary);flex-shrink:0;transition:transform .15s ease;}
  .country-select.open .country-trigger .chev{transform:rotate(180deg);}
  .country-dropdown-panel{
    position:absolute;top:calc(100% + 8px);left:0;width:220px;max-height:340px;overflow-y:auto;
    background:var(--surface-page);border:1px solid var(--border-primary);border-radius:var(--radius-card);
    box-shadow:0 8px 24px rgba(0,0,0,.15);padding:4px;display:none;flex-direction:column;gap:2px;z-index:600;
  }
  .country-select.open .country-dropdown-panel{display:flex;}
  .country-dropdown-panel .item{
    display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-input);
    font-size:14px;color:var(--text-heading-2);cursor:pointer;background:none;border:none;
    width:100%;text-align:left;font-family:var(--font-family);
  }
  .country-dropdown-panel .item:hover{background:var(--surface-secondary);}
  .country-dropdown-panel .item.selected{background:var(--surface-success);color:var(--text-success);font-weight:700;}
  .country-dropdown-panel .item .ic{color:var(--text-success);flex-shrink:0;visibility:hidden;}
  .country-dropdown-panel .item.selected .ic{visibility:visible;}

</style>
</head>
<body>

<div class="app-shell">

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="navbar-left">
      <div class="logo-tile"><svg viewBox="0 0 140 176"><use href="#logo-mark"></use></svg></div>

      <div class="country-select">
        <button class="country-trigger" onclick="toggleCountryDropdown(event)">
          <span class="flag" id="country-trigger-flag">🇷🇴</span>
          <span id="country-trigger-label">Romania</span>
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M11.9999 13.1714L16.9497 8.22168L18.3639 9.63589L11.9999 15.9999L5.63599 9.63589L7.0502 8.22168L11.9999 13.1714Z"/></svg>
        </button>
        <div class="country-dropdown-panel" id="country-dropdown-panel">
          <button class="item selected" onclick="selectCountry(this,'Romania')"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9.9997 15.1709L19.1921 5.97852L20.6063 7.39273L9.9997 17.9993L3.63574 11.6354L5.04996 10.2212L9.9997 15.1709Z"/></svg><span class="item-label">Romania</span></button>
          <button class="item" onclick="selectCountry(this,'Bulgaria')"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9.9997 15.1709L19.1921 5.97852L20.6063 7.39273L9.9997 17.9993L3.63574 11.6354L5.04996 10.2212L9.9997 15.1709Z"/></svg><span class="item-label">Bulgaria</span></button>
          <button class="item" onclick="selectCountry(this,'Czechia')"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9.9997 15.1709L19.1921 5.97852L20.6063 7.39273L9.9997 17.9993L3.63574 11.6354L5.04996 10.2212L9.9997 15.1709Z"/></svg><span class="item-label">Czechia</span></button>
          <button class="item" onclick="selectCountry(this,'Estonia')"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9.9997 15.1709L19.1921 5.97852L20.6063 7.39273L9.9997 17.9993L3.63574 11.6354L5.04996 10.2212L9.9997 15.1709Z"/></svg><span class="item-label">Estonia</span></button>
          <button class="item" onclick="selectCountry(this,'Croatia')"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9.9997 15.1709L19.1921 5.97852L20.6063 7.39273L9.9997 17.9993L3.63574 11.6354L5.04996 10.2212L9.9997 15.1709Z"/></svg><span class="item-label">Croatia</span></button>
          <button class="item" onclick="selectCountry(this,'Hungary')"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9.9997 15.1709L19.1921 5.97852L20.6063 7.39273L9.9997 17.9993L3.63574 11.6354L5.04996 10.2212L9.9997 15.1709Z"/></svg><span class="item-label">Hungary</span></button>
          <button class="item" onclick="selectCountry(this,'Latvia')"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9.9997 15.1709L19.1921 5.97852L20.6063 7.39273L9.9997 17.9993L3.63574 11.6354L5.04996 10.2212L9.9997 15.1709Z"/></svg><span class="item-label">Latvia</span></button>
          <button class="item" onclick="selectCountry(this,'Poland')"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9.9997 15.1709L19.1921 5.97852L20.6063 7.39273L9.9997 17.9993L3.63574 11.6354L5.04996 10.2212L9.9997 15.1709Z"/></svg><span class="item-label">Poland</span></button>
          <button class="item" onclick="selectCountry(this,'Portugal')"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9.9997 15.1709L19.1921 5.97852L20.6063 7.39273L9.9997 17.9993L3.63574 11.6354L5.04996 10.2212L9.9997 15.1709Z"/></svg><span class="item-label">Portugal</span></button>
          <button class="item" onclick="selectCountry(this,'Slovakia')"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9.9997 15.1709L19.1921 5.97852L20.6063 7.39273L9.9997 17.9993L3.63574 11.6354L5.04996 10.2212L9.9997 15.1709Z"/></svg><span class="item-label">Slovakia</span></button>
        </div>
      </div>

      <a href="frontera-my-regions.html" class="nav-link active">All Sales Regions (<span id="nav-all-regions-count">0</span>)</a>
      <div id="navbar-region-tabs"></div>
    </div>
    <div class="navbar-right">
      <a href="frontera-account.html" class="nav-link ">Account</a>
      <button class="nav-icon-btn" title="Log out" onclick="window.location.href='frontera-signup.html'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M5 22C4.44772 22 4 21.5523 4 21V3C4 2.44772 4.44772 2 5 2H19C19.5523 2 20 2.44772 20 3V6H18V4H6V20H18V18H20V21C20 21.5523 19.5523 22 19 22H5ZM18 16V13H11V11H18V8L23 12L18 16Z"/></svg>
      </button>
    </div>
  </div>

  <!-- BODY -->
  <div class="body-row">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="stats-banner">
        <div class="stats-banner-header">
          <div class="country"><span class="flag">🇷🇴</span>Romania</div>
          <a href="frontera-country-details.html" class="view-details-link">View Details<svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9.29289 6.70711L10.7071 5.29289L18.4142 13L10.7071 20.7071L9.29289 19.2929L15.5858 13L9.29289 6.70711Z"/></svg></a>
        </div>
        <div class="stats-banner-row">
          <div class="stat">
            <span class="label">Total country area</span>
            <span class="value">482,300 ha</span>
          </div>
          <div class="stat">
            <span class="label">Cropland area</span>
            <span class="value">172,180 ha</span>
          </div>
          <div class="stat">
            <span class="label">Selected Area</span>
            <span class="value">310,120 ha <span class="pct-inline">(64%)</span></span>
          </div>
        </div>
      </div>

      <h1>Sales Regions (<span id="region-count">0</span>)</h1>

      <div id="region-list" style="display:flex;flex-direction:column;gap:16px;">
        <!-- region card template gets cloned by JS too -->
      </div>

      <div class="add-region-card" id="add-region-btn" onclick="addRegion(false)">
        <div class="plus">+</div>
        <span class="label">Add region</span>
      </div>
    </div>

    <!-- MAP -->
    <div class="map-wrap">
      <div id="map"></div>

      <div class="map-search">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.031 16.6168L22.3137 20.8995L20.8995 22.3137L16.6168 18.031C15.0769 19.263 13.124 20 11 20C6.032 20 2 15.968 2 11C2 6.032 6.032 2 11 2C15.968 2 20 6.032 20 11C20 13.124 19.263 15.0769 18.031 16.6168ZM16.0247 15.8748C17.2475 14.6146 18 12.8956 18 11C18 7.1325 14.8675 4 11 4C7.1325 4 4 7.1325 4 11C4 14.8675 7.1325 18 11 18C12.8956 18 14.6146 17.2475 15.8748 16.0247L16.0247 15.8748Z"/></svg>
        <input type="text" placeholder="Search">
      </div>

      <div class="map-controls">
        <div class="map-btn-group">
          <button class="map-btn" onclick="map.zoomIn()">+</button>
          <button class="map-btn" onclick="map.zoomOut()">–</button>
        </div>
        <button class="map-btn" title="Reset bearing" onclick="map.setBearing && map.setBearing(0)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L19 21L12 17L5 21L12 2Z"/></svg>
        </button>
        <button class="map-btn" title="My location" onclick="locateMe()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3.05493C17.3924 3.55238 20.8236 7.25142 20.9938 11.7605C22.1213 11.8955 23 12.8492 23 14C23 15.1508 22.1213 16.1045 20.9938 16.2395C20.8236 20.7486 17.3924 24.4476 13 24.9451V27H11V24.9451C6.60761 24.4476 3.17642 20.7486 3.00625 16.2395C1.87868 16.1045 1 15.1508 1 14C1 12.8492 1.87868 11.8955 3.00625 11.7605C3.17642 7.25142 6.60761 3.55238 11 3.05493V1H13V3.05493ZM12 5C8.13401 5 5 8.13401 5 12C5 15.866 8.13401 19 12 19C15.866 19 19 15.866 19 12C19 8.13401 15.866 5 12 5ZM12 15C9.79086 15 8 13.2091 8 11C8 8.79086 9.79086 7 12 7C14.2091 7 16 8.79086 16 11C16 13.2091 14.2091 15 12 15Z" transform="translate(0,-1) scale(1,0.93)"/></svg>

  <symbol id="logo-mark" viewBox="0 0 140 176"><path d="M138.629 0.599841C140.039 1.35984 139.869 3.09984 139.929 4.55984C139.759 11.8498 140.259 26.1298 139.729 33.3598C138.879 37.9898 132.249 36.9198 128.679 38.0998C120.949 39.4498 114.749 42.5498 108.669 47.0898C103.609 50.8698 99.159 56.0898 95.829 61.3698C94.649 63.7798 90.139 69.4898 95.199 69.2898C104.679 69.6398 127.589 68.7598 138.439 69.6498C140.209 70.4698 139.739 72.9298 139.919 74.6998C139.939 81.6198 139.939 96.5698 139.919 102.1C139.939 105.73 139.399 105.7 134.639 105.65C122.189 105.76 98.139 105.89 89.589 106C84.889 105.95 85.389 111.57 84.059 114.79C74.359 145.74 46.439 169.68 14.199 174.68C10.199 175.11 4.85904 176.45 1.36904 174.55C0.119039 173.6 -0.0109671 171.33 0.0190329 168.04C0.0190329 161.38 -0.000987858 150.35 0.0290121 144.88C-0.0209879 142.09 0.279035 139.87 3.20904 139.02C8.28904 137.67 14.129 137.3 18.919 135.07C23.129 133.42 27.209 131.14 30.829 128.52C37.019 124.18 44.319 115.55 46.529 108.36C47.229 105.97 43.859 105.9 41.889 105.98C38.219 105.98 34.829 105.98 30.359 105.98C21.879 105.98 13.069 106 4.65902 105.98C1.34902 105.92 0.409017 105.86 0.159017 103.01C-0.140983 98.0098 0.0890329 92.9598 0.0190329 87.8098C-0.000967106 83.0698 -0.0109793 75.8498 0.0690207 72.1198C0.129021 71.1498 0.259019 70.5598 0.599019 70.2098C9.18902 68.7198 37.429 69.8498 48.729 69.3098C53.979 69.9798 54.449 64.4698 55.759 60.5699C63.909 34.5398 85.339 12.4498 111.529 4.30984C120.059 1.63984 129.709 -1.25016 138.539 0.569842L138.639 0.619845L138.629 0.599841Z" fill="white"/></symbol>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ---- Map setup: CARTO Positron (light) basemap via Leaflet ----
  const map = L.map('map', { zoomControl:false, attributionControl:true }).setView([45.9432, 24.9668], 7);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://carto.com/attributions">CARTO</a> &copy; OpenStreetMap contributors',
    subdomains: 'abcd',
    maxZoom: 20
  }).addTo(map);

  function locateMe(){
    map.locate({setView:true, maxZoom:12});
  }

  // Example sales region polygons — replace with real geometry
  function addRegionPolygon(coords, fillColor, label, tooltipClass){
    const polygon = L.polygon(coords, {
      color: '#0e131e',
      weight: 2,
      fillColor: fillColor,
      fillOpacity: 0.35
    }).addTo(map);

    polygon.bindTooltip(label, {
      permanent: true,
      direction: 'center',
      className: tooltipClass
    });

    return polygon;
  }

  const regionAPolygon = addRegionPolygon([
    [46.35, 24.2],
    [46.35, 25.6],
    [45.55, 25.9],
    [45.35, 24.6],
    [45.75, 23.9]
  ], '#00c950', 'Region A', 'region-label-tooltip-green');

  const regionBPolygon = addRegionPolygon([
    [47.6, 23.0],
    [47.9, 24.6],
    [47.2, 25.2],
    [46.7, 24.1],
    [47.0, 22.9]
  ], '#1d7afc', 'Region B', 'region-label-tooltip-blue');

  // Style the tooltips via injected class (Leaflet wraps tooltip content, so we target via CSS below)
  const style = document.createElement('style');
  style.innerHTML = `
    .region-label-tooltip-green, .region-label-tooltip-blue{
      color:var(--text-heading-2);font-weight:700;font-size:12px;
      padding:4px 10px;border-radius:999px;border:1.5px solid var(--surface-page);
      box-shadow:0 1px 4px rgba(0,0,0,.15);font-family:var(--font-family);
    }
    .region-label-tooltip-green{background:#00c950;}
    .region-label-tooltip-blue{background:#1d7afc;color:#fff;}
    .region-label-tooltip-green::before, .region-label-tooltip-blue::before{display:none;}
  `;
  document.head.appendChild(style);

  // ---- Region cards (sidebar) ----
  let regionCount = 0;
  const regionColors = ['#00c950', '#1d7afc', '#dd7208', '#a855f7', '#02ae46'];

  function regionCardTemplate(name, color, hasData, data){
    const dash = '—';
    const d = data || {};
    const selectedArea = hasData ? (d.selectedArea || '86,400 ha') : dash;
    const croplandArea = hasData ? (d.croplandArea || '61,250 ha') : dash;
    const promoters = hasData ? (d.promoters || '14') : dash;
    const visitStops = hasData ? (d.visitStops || '24 stops') : dash;
    const pen = hasData ? (d.pen || '23%') : dash;
    const con = hasData ? (d.con || '71%') : dash;
    const ret = hasData ? (d.ret || '52%') : dash;
    const actionLabel = hasData ? 'View Details' : 'Select area';

    return `
      <div class="region-card">
        <div class="region-card-top">
          <div class="region-name">
            <span class="region-swatch" style="background:${color};"></span>
            <input type="text" value="${name}">
          </div>
          <div class="region-card-actions">
            <button class="icon-btn" title="Delete region" onclick="this.closest('.region-card').remove(); updateRegionCount();">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4V2H17V4H22V6H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V6H2V4H7ZM6 6V20H18V6H6ZM9 9H11V17H9V9ZM13 9H15V17H13V9Z"/></svg>
            </button>
            <a href="frontera-region-details.html" class="view-details-link">${actionLabel}<svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9.29289 6.70711L10.7071 5.29289L18.4142 13L10.7071 20.7071L9.29289 19.2929L15.5858 13L9.29289 6.70711Z"/></svg></a>
          </div>
        </div>

        <div class="region-meta">
          <div class="item"><div class="label">Selected area</div><div class="value">${selectedArea}</div></div>
          <div class="item"><div class="label">Cropland area</div><div class="value">${croplandArea}</div></div>
          <div class="item"><div class="label">Promoters</div><div class="value">${promoters}</div></div>
          <div class="item"><div class="label">Visit planner</div><div class="value">${visitStops}</div></div>
        </div>

        <div class="assumptions">
          <div class="title-row">
            <span class="title">Sales Assumptions</span>
            <span class="info-icon">i<span class="tooltip-bubble">In production these come from the imported Salesforce data (per region)</span></span>
          </div>
          <div class="assumptions-row">
            <div class="assumption-pill"><div class="pct">${pen}</div><div class="tag">Pen</div></div>
            <div class="assumption-pill"><div class="pct">${con}</div><div class="tag">Con</div></div>
            <div class="assumption-pill"><div class="pct">${ret}</div><div class="tag">Ret</div></div>
          </div>
        </div>

      </div>
    `;
  }

  function updateRegionCount(){
    const count = document.getElementById('region-list').children.length;
    document.getElementById('region-count').textContent = count;
    document.getElementById('nav-all-regions-count').textContent = count;
    renderRegionNavTabs();
  }

  function addRegion(hasData, data){
    regionCount++;
    const letter = String.fromCharCode(64 + regionCount); // A, B, C...
    const color = regionColors[(regionCount - 1) % regionColors.length];
    const list = document.getElementById('region-list');
    const wrapper = document.createElement('div');
    wrapper.innerHTML = regionCardTemplate('Region ' + letter, color, hasData, data);
    const cardEl = wrapper.firstElementChild;
    list.appendChild(cardEl);
    cardEl.querySelector('.region-name input').addEventListener('input', renderRegionNavTabs);
    updateRegionCount();
  }

  // seed with two filled example regions on load
  addRegion(true, { selectedArea:'86,400 ha', croplandArea:'61,250 ha', promoters:'14', visitStops:'24 stops', pen:'23%', con:'71%', ret:'52%' });
  addRegion(true, { selectedArea:'62,900 ha', croplandArea:'44,180 ha', promoters:'9',  visitStops:'17 stops', pen:'31%', con:'64%', ret:'58%' });

  // ---- Header region tabs: reflects the live region list ----
  // Rule: <=4 regions -> show all directly. 5+ -> show first 3, rest collapse into "Other (N)".
  function truncateName(name){
    return name.length > 12 ? name.slice(0, 12) + '…' : name;
  }

  function getCurrentRegionNames(){
    return Array.from(document.querySelectorAll('#region-list .region-name input')).map(i => i.value.trim() || 'Untitled');
  }

  function renderRegionNavTabs(){
    const names = getCurrentRegionNames();
    const container = document.getElementById('navbar-region-tabs');
    const visible = names.length <= 4 ? names : names.slice(0, 3);
    const hidden = names.length <= 4 ? [] : names.slice(3);

    let html = visible.map(name => `
      <a href="frontera-region-details.html" class="nav-link nav-region-link" title="${name}">${truncateName(name)}</a>
    `).join('');

    if (hidden.length > 0){
      html += `
        <div class="nav-dropdown">
          <button class="nav-link nav-dropdown-trigger" onclick="toggleNavDropdown(event)">
            Other (${hidden.length})
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M11.9999 13.1714L16.9497 8.22168L18.3639 9.63589L11.9999 15.9999L5.63599 9.63589L7.0502 8.22168L11.9999 13.1714Z"/></svg>
          </button>
          <div class="nav-dropdown-menu">
            ${hidden.map(name => `<a href="frontera-region-details.html" title="${name}">${name}</a>`).join('')}
          </div>
        </div>
      `;
    }

    container.innerHTML = html;
  }

  renderRegionNavTabs();

  function toggleNavDropdown(e){
    e.stopPropagation();
    e.currentTarget.closest('.nav-dropdown').classList.toggle('open');
  }
  document.addEventListener('click', function(e){
    document.querySelectorAll('.nav-dropdown.open').forEach(dd => {
      if (!dd.contains(e.target)) dd.classList.remove('open');
    });
  });

  // ---- Country dropdown ----
  function toggleCountryDropdown(e){
    e.stopPropagation();
    document.querySelector('.country-select').classList.toggle('open');
  }
  const countryFlags = {
    'Romania':'🇷🇴','Bulgaria':'🇧🇬','Czechia':'🇨🇿','Estonia':'🇪🇪','Croatia':'🇭🇷',
    'Hungary':'🇭🇺','Latvia':'🇱🇻','Poland':'🇵🇱','Portugal':'🇵🇹','Slovakia':'🇸🇰'
  };
  function selectCountry(el, name){
    document.querySelectorAll('.country-dropdown-panel .item').forEach(i => i.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('country-trigger-label').textContent = name;
    document.getElementById('country-trigger-flag').textContent = countryFlags[name] || '🏳️';
    document.querySelector('.country-select').classList.remove('open');
  }
  document.addEventListener('click', function(e){
    const cs = document.querySelector('.country-select');
    if (cs && !cs.contains(e.target)) cs.classList.remove('open');
  });

</script>

</body>
